<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  <!-- Antenna -->
  <line x1="32" y1="18" x2="32" y2="8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="3.5" fill="#38bdf8"/>
  <!-- Robot Head / Helmet -->
  <rect x="14" y="16" width="36" height="34" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Visor -->
  <rect x="19" y="24" width="26" height="16" rx="6" fill="#0f172a"/>
  <!-- Glowing Cyan Eyes -->
  <circle cx="26" cy="32" r="3" fill="#38bdf8"/>
  <circle cx="38" cy="32" r="3" fill="#38bdf8"/>
  <!-- Chest Glow Dot -->
  <circle cx="32" cy="45" r="2" fill="#2563eb"/>
</svg>
